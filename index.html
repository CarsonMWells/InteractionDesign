  <header class="site-header">

    </div>
  
    <div class="header-bottom">
      <nav class="main-nav">
        <ul class="nav-links">

          <li><a href="#equipment">Equipment</a></li>
          <li><a href="#learn">Learn</a></li>
        </ul>
      </nav>
  
      <div class="header-actions">
        <a href="#search" aria-label="Search">
          <img src="images/SearchVector.png" alt="Search" class="icon">
        </a>
        <a href="#account" aria-label="User Account">
          <img src="images/ProfileVector.png" alt="User Account" class="icon">

  <main>

    </section>

      <div id="salePopup" class="popup-overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">

              <img src="images/PopupImage.png" alt="Pour over coffee brewing" class="popup-image">

          </div>

          <div class="popup-right">
            <button id="closePopup" class="popup-close-btn" aria-label="Close popup">&times;</button>
